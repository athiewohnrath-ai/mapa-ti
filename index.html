<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Workflow · Athié Wohnrath</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:     #f0ede8;
  --bg2:    #faf9f7;
  --bg3:    #e8e4de;
  --border: rgba(0,0,0,.08);
  --border2:rgba(0,0,0,.14);
  --text:   #1a1814;
  --text2:  #6b6560;
  --text3:  #a8a39d;
  --accent: #1a56db;
  --accent2:#f0f4ff;
  --red:    #c42b2b;
  --green:  #15803d;
  --amber:  #b45309;
  --shadow: 0 1px 3px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.06);
  --shadow2:0 2px 8px rgba(0,0,0,.08), 0 12px 40px rgba(0,0,0,.1);
  --r: 12px; --rl: 16px;
}
body.dark {
  --bg:#111010; --bg2:#191817; --bg3:#201f1e;
  --border:rgba(255,255,255,.07); --border2:rgba(255,255,255,.13);
  --text:#edeae6; --text2:#8a8480; --text3:#554f4a;
  --accent:#4f8ef7; --accent2:rgba(79,142,247,.1);
  --red:#f05454; --green:#34d399; --amber:#fbbf24;
  --shadow:0 1px 3px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.3);
  --shadow2:0 2px 8px rgba(0,0,0,.4),0 12px 40px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s;}

/* ── HOME ── */
#home { display:flex; flex-direction:column; min-height:100vh; }

/* Header */
#home-hd {
  padding:20px 32px;
  display:flex; align-items:center; justify-content:space-between;
  border-bottom:1px solid var(--border);
  background:var(--bg2);
  position:sticky; top:0; z-index:10;
}
#home-logo { display:flex; align-items:center; gap:12px; }
#home-logo-mark {
  width:36px; height:36px;
  background:linear-gradient(135deg,#1a56db,#6366f1);
  border-radius:10px;
  display:flex; align-items:center; justify-content:center;
  font-size:16px; flex-shrink:0;
}
#home-logo-title { font-size:15px; font-weight:600; color:var(--text); letter-spacing:-.01em; }
#home-logo-sub   { font-size:11px; color:var(--text3); margin-top:1px; }
#home-hd-right   { display:flex; align-items:center; gap:10px; }
.hd-btn {
  padding:7px 16px; border-radius:8px; font-size:12px; font-weight:500;
  font-family:inherit; cursor:pointer; transition:all .15s;
  border:1px solid var(--border2); background:var(--bg3); color:var(--text2);
}
.hd-btn:hover{background:var(--bg);color:var(--text);}
.hd-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
.hd-btn.primary:hover{opacity:.88;}

/* Grid */
#home-body { flex:1; padding:32px; max-width:1100px; margin:0 auto; width:100%; }
#home-toolbar {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:24px;
}
#home-title { font-size:22px; font-weight:600; letter-spacing:-.02em; color:var(--text); }
#home-count { font-size:12px; color:var(--text3); margin-top:2px; font-family:'DM Mono',monospace; }

#wf-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  gap:16px;
}

/* Workflow card */
.wf-card {
  background:var(--bg2); border:1px solid var(--border);
  border-radius:var(--rl); padding:20px;
  cursor:pointer; transition:all .18s;
  display:flex; flex-direction:column; gap:12px;
  box-shadow:var(--shadow);
  position:relative; overflow:hidden;
}
.wf-card:hover { border-color:var(--border2); box-shadow:var(--shadow2); transform:translateY(-1px); }
.wf-card-top { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
.wf-card-name { font-size:15px; font-weight:600; color:var(--text); letter-spacing:-.01em; line-height:1.3; }
.wf-card-desc { font-size:12px; color:var(--text3); line-height:1.5; flex:1; }
.wf-card-meta {
  display:flex; align-items:center; justify-content:space-between;
  padding-top:12px; border-top:1px solid var(--border);
}
.wf-badge {
  font-size:10px; font-weight:600; padding:3px 9px;
  border-radius:99px; font-family:'DM Mono',monospace; letter-spacing:.04em;
  text-transform:uppercase;
}
.wf-badge.dev     { background:#fef3c7; color:#92400e; }
.wf-badge.val     { background:#d1fae5; color:#065f46; }
.wf-badge.sup     { background:var(--bg3); color:var(--text3); }
body.dark .wf-badge.dev { background:rgba(251,191,36,.15); color:#fbbf24; }
body.dark .wf-badge.val { background:rgba(52,211,153,.12); color:#34d399; }
.wf-date { font-size:10px; color:var(--text3); font-family:'DM Mono',monospace; }

.wf-actions { display:flex; gap:5px; }
.wf-act {
  width:28px; height:28px; border-radius:7px;
  border:1px solid var(--border); background:var(--bg3);
  color:var(--text3); font-size:13px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:all .12s; flex-shrink:0;
}
.wf-act:hover { color:var(--text); border-color:var(--border2); background:var(--bg); }
.wf-act.danger:hover { color:var(--red); border-color:rgba(196,43,43,.3); }

/* New card */
.wf-new {
  border:1.5px dashed var(--border2); background:transparent;
  color:var(--text3); display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:8px;
  min-height:160px; cursor:pointer; transition:all .18s;
  border-radius:var(--rl);
}
.wf-new:hover { border-color:var(--accent); color:var(--accent); background:var(--accent2); }
.wf-new-icon { font-size:24px; }
.wf-new-label { font-size:13px; font-weight:500; }

/* Empty state */
#empty-state {
  grid-column:1/-1; text-align:center; padding:60px 20px;
  color:var(--text3);
}
#empty-state .ico { font-size:48px; margin-bottom:16px; }
#empty-state h3 { font-size:18px; font-weight:600; color:var(--text2); margin-bottom:8px; }
#empty-state p  { font-size:13px; line-height:1.6; }

/* ── DIALOG ── */
.dlg-overlay {
  display:none; position:fixed; inset:0;
  background:rgba(0,0,0,.45); backdrop-filter:blur(3px);
  z-index:200; align-items:center; justify-content:center;
}
.dlg-overlay.open { display:flex; }
.dlg-box {
  background:var(--bg2); border:1px solid var(--border2);
  border-radius:var(--rl); width:420px; max-width:95vw;
  box-shadow:var(--shadow2); overflow:hidden;
  animation:dlgIn .18s ease;
}
@keyframes dlgIn { from{opacity:0;transform:scale(.96) translateY(-8px)} to{opacity:1;transform:none} }
.dlg-hd {
  padding:16px 20px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;
}
.dlg-title { font-size:14px; font-weight:600; color:var(--text); }
.dlg-close { background:none; border:none; font-size:20px; color:var(--text3); cursor:pointer; }
.dlg-body { padding:20px; }
.dlg-ft { padding:14px 20px; border-top:1px solid var(--border); display:flex; gap:8px; justify-content:flex-end; }

.fld { margin-bottom:14px; }
.fld label { font-size:11px; font-weight:600; color:var(--text3); text-transform:uppercase; letter-spacing:.06em; display:block; margin-bottom:5px; }
.fld input, .fld textarea, .fld select {
  width:100%; padding:8px 12px; border-radius:9px;
  border:1px solid var(--border2); background:var(--bg3);
  color:var(--text); font-size:13px; font-family:inherit; outline:none;
  transition:border-color .15s;
}
.fld input:focus, .fld textarea:focus, .fld select:focus { border-color:var(--accent); }
.fld textarea { resize:vertical; min-height:70px; }
.fld select { cursor:pointer; }

.btn { padding:8px 18px; border-radius:9px; font-size:13px; font-weight:500; cursor:pointer; font-family:inherit; border:none; transition:all .15s; }
.btn.primary { background:var(--accent); color:#fff; }
.btn.primary:hover { opacity:.88; }
.btn.ghost { background:var(--bg3); color:var(--text2); border:1px solid var(--border2); }
.btn.ghost:hover { background:var(--bg); color:var(--text); }
.btn.danger { background:var(--red); color:#fff; }

/* Confirm dialog */
.dlg-confirm-icon { font-size:32px; text-align:center; margin-bottom:10px; }
.dlg-confirm-t    { font-size:15px; font-weight:600; color:var(--text); text-align:center; margin-bottom:6px; }
.dlg-confirm-s    { font-size:12px; color:var(--text3); text-align:center; line-height:1.6; margin-bottom:20px; }

/* Status badges inline */
.status-opts { display:flex; gap:8px; flex-wrap:wrap; margin-top:4px; }
.status-opt {
  padding:6px 14px; border-radius:99px; font-size:11px; font-weight:600;
  cursor:pointer; border:2px solid transparent; transition:all .15s;
  font-family:'DM Mono',monospace; text-transform:uppercase; letter-spacing:.04em;
}
.status-opt.dev { background:#fef3c7; color:#92400e; }
.status-opt.val { background:#d1fae5; color:#065f46; }
.status-opt.sup { background:var(--bg3); color:var(--text3); }
.status-opt.selected { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent2); }
body.dark .status-opt.dev { background:rgba(251,191,36,.15); color:#fbbf24; }
body.dark .status-opt.val { background:rgba(52,211,153,.12); color:#34d399; }

/* Toast */
#toast {
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
  background:var(--text); color:var(--bg2); padding:10px 20px;
  border-radius:99px; font-size:12px; font-weight:500;
  box-shadow:var(--shadow2); z-index:500;
  opacity:0; transition:opacity .2s; pointer-events:none;
}
#toast.show { opacity:1; }
</style>
</head>
<body>

<!-- HOME SCREEN -->
<div id="home">
  <div id="home-hd">
    <div id="home-logo">
      <div id="home-logo-mark">⚡</div>
      <div>
        <div id="home-logo-title">Workflow</div>
        <div id="home-logo-sub">Athié Wohnrath</div>
      </div>
    </div>
    <div id="home-hd-right">
      <button class="hd-btn" onclick="toggleTheme()" id="theme-btn">🌙</button>
      <button class="hd-btn primary" onclick="openNewWF()">+ Novo workflow</button>
    </div>
  </div>

  <div id="home-body">
    <div id="home-toolbar">
      <div>
        <div id="home-title">Meus Workflows</div>
        <div id="home-count">— workflows</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <select id="filter-status" onchange="renderGrid()" style="padding:6px 12px;border-radius:8px;border:1px solid var(--border2);background:var(--bg3);color:var(--text);font-size:12px;font-family:inherit;cursor:pointer">
          <option value="">Todos os status</option>
          <option value="dev">Em desenvolvimento</option>
          <option value="val">Validado</option>
          <option value="sup">Superado</option>
        </select>
      </div>
    </div>
    <div id="wf-grid"></div>
  </div>
</div>

<!-- Dialog: novo/editar workflow -->
<div class="dlg-overlay" id="dlg-wf">
  <div class="dlg-box">
    <div class="dlg-hd">
      <span class="dlg-title" id="dlg-wf-title">Novo workflow</span>
      <button class="dlg-close" onclick="closeDlgWF()">×</button>
    </div>
    <div class="dlg-body">
      <input type="hidden" id="wf-edit-id">
      <div class="fld">
        <label>Nome *</label>
        <input id="wf-name" type="text" placeholder="Ex: Fluxo Comercial, Integração ERP...">
      </div>
      <div class="fld">
        <label>Descrição</label>
        <textarea id="wf-desc" placeholder="O que este workflow representa?"></textarea>
      </div>
      <div class="fld">
        <label>Status</label>
        <div class="status-opts">
          <div class="status-opt dev selected" data-s="dev" onclick="pickStatus('dev')">Em desenvolvimento</div>
          <div class="status-opt val" data-s="val" onclick="pickStatus('val')">Validado</div>
          <div class="status-opt sup" data-s="sup" onclick="pickStatus('sup')">Superado</div>
        </div>
        <input type="hidden" id="wf-status" value="dev">
      </div>
    </div>
    <div class="dlg-ft">
      <button class="btn ghost" onclick="closeDlgWF()">Cancelar</button>
      <button class="btn primary" onclick="saveWF()">Salvar</button>
    </div>
  </div>
</div>

<!-- Dialog: confirmar exclusão -->
<div class="dlg-overlay" id="dlg-del">
  <div class="dlg-box">
    <div class="dlg-body" style="padding:28px 24px">
      <div class="dlg-confirm-icon">🗑️</div>
      <div class="dlg-confirm-t">Excluir workflow?</div>
      <div class="dlg-confirm-s">Tem certeza que deseja excluir<br><strong id="del-wf-name"></strong>?<br>Esta ação não pode ser desfeita.</div>
      <div style="display:flex;gap:8px;justify-content:center">
        <button class="btn ghost" onclick="document.getElementById('dlg-del').classList.remove('open')">Cancelar</button>
        <button class="btn danger" id="del-confirm-btn">Excluir</button>
      </div>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
// ─── CONFIG ──────────────────────────────────────────────────────────────────
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby4mvK7fnaKnAGEeE96XxBnBcP_MywkIYTCq4yawxhXNy1CXGPoOpCqPXec6zV8xB_Q/exec';
const SHEET_ID   = '1kWu9OjSFVvU92YTojbxf_MBC41Sz8QACUAwzoB_pSAA';
const WF_CSV     = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Workflows`;
const WF_JSON_CSV= `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=WorkflowsJSON`;

// ─── State ────────────────────────────────────────────────────────────────────
let workflows = [];
let settings  = {dark: false};

// ─── Persist ──────────────────────────────────────────────────────────────────
function saveLocal() {
  try { localStorage.setItem('aw_workflows_home', JSON.stringify({workflows, settings})); } catch(e){}
}
function loadLocal() {
  try {
    const s = localStorage.getItem('aw_workflows_home');
    if (s) { const p=JSON.parse(s); workflows=p.workflows||[]; settings={...settings,...(p.settings||{})}; }
  } catch(e){}
}

// ─── Sheets sync ──────────────────────────────────────────────────────────────
async function postSheet(payload) {
  const url = SCRIPT_URL + '?data=' + encodeURIComponent(JSON.stringify(payload));
  try { await fetch(url, {mode:'no-cors'}); } catch(e) {}
}

async function loadWorkflowsFromSheets() {
  try {
    const r = await fetch(WF_JSON_CSV + '&t=' + Date.now());
    if (!r.ok) return false;
    const txt = await r.text();
    if (!txt || txt.includes('<!DOCTYPE')) return false;
    const lines = txt.trim().split('\n');
    if (lines.length < 2) return false;
    const raw = lines[1].replace(/^"|"$/g,'').replace(/""/g,'"').trim();
    if (!raw || !raw.startsWith('[')) return false;
    const parsed = JSON.parse(raw);
    if (!Array.isArray(parsed)) return false;
    workflows = parsed;
    saveLocal();
    return true;
  } catch(e) { return false; }
}

async function saveWorkflowsToSheets() {
  await postSheet({action:'saveWorkflows', workflows});
}

// ─── Init ─────────────────────────────────────────────────────────────────────
async function init() {
  loadLocal();
  applySett();
  updateCount();
  renderGrid();

  // Load from Sheets
  try {
    await loadWorkflowsFromSheets();
    renderGrid();
  } catch(e) {}

  // Check URL hash - if has workflow ID, open it
  const hash = location.hash.replace('#','');
  if (hash && hash.startsWith('wf_')) {
    const wf = workflows.find(w=>w.id===hash);
    if (wf) openWorkflow(wf);
  }
}

// ─── Settings ─────────────────────────────────────────────────────────────────
function applySett() {
  document.body.classList.toggle('dark', settings.dark);
  document.getElementById('theme-btn').textContent = settings.dark ? '☀️' : '🌙';
}
function toggleTheme() { settings.dark=!settings.dark; applySett(); saveLocal(); }

// ─── Render grid ──────────────────────────────────────────────────────────────
function updateCount() {
  const el = document.getElementById('home-count');
  if (el) el.textContent = workflows.length + ' workflow' + (workflows.length!==1?'s':'');
}

function renderGrid() {
  const grid = document.getElementById('wf-grid');
  const filter = document.getElementById('filter-status').value;
  const filtered = filter ? workflows.filter(w=>w.status===filter) : workflows;

  updateCount();

  if (!filtered.length && !workflows.length) {
    grid.innerHTML = `
      <div id="empty-state">
        <div class="ico">⚡</div>
        <h3>Nenhum workflow ainda</h3>
        <p>Crie seu primeiro workflow para começar<br>a mapear processos e sistemas.</p>
      </div>
      <div class="wf-new" onclick="openNewWF()">
        <div class="wf-new-icon">+</div>
        <div class="wf-new-label">Novo workflow</div>
      </div>`;
    return;
  }

  const statusLabel = {dev:'Em desenvolvimento', val:'Validado', sup:'Superado'};
  const cards = filtered.map(wf => `
    <div class="wf-card" onclick="openWorkflow(${JSON.stringify(wf).replace(/"/g,'&quot;')})">
      <div class="wf-card-top">
        <div>
          <div class="wf-card-name">${esc(wf.name)}</div>
          ${wf.desc ? `<div class="wf-card-desc" style="margin-top:5px">${esc(wf.desc)}</div>` : ''}
        </div>
        <div class="wf-actions" onclick="event.stopPropagation()">
          <button class="wf-act" onclick="openEditWF('${wf.id}')" title="Editar">✎</button>
          <button class="wf-act" onclick="duplicateWF('${wf.id}')" title="Duplicar">⎘</button>
          <button class="wf-act danger" onclick="confirmDeleteWF('${wf.id}')" title="Excluir">🗑</button>
        </div>
      </div>
      <div class="wf-card-meta">
        <span class="wf-badge ${wf.status||'dev'}">${statusLabel[wf.status||'dev']}</span>
        <span class="wf-date">${formatDate(wf.updatedAt||wf.createdAt)}</span>
      </div>
    </div>`).join('');

  grid.innerHTML = cards + `
    <div class="wf-new" onclick="openNewWF()">
      <div class="wf-new-icon">+</div>
      <div class="wf-new-label">Novo workflow</div>
    </div>`;
}

// ─── Utils ────────────────────────────────────────────────────────────────────
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function formatDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'});
}
function toast(msg, dur=2500) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), dur);
}

// ─── Workflow CRUD ─────────────────────────────────────────────────────────────
function openNewWF() {
  document.getElementById('wf-edit-id').value = '';
  document.getElementById('wf-name').value = '';
  document.getElementById('wf-desc').value = '';
  pickStatus('dev');
  document.getElementById('dlg-wf-title').textContent = 'Novo workflow';
  document.getElementById('dlg-wf').classList.add('open');
  setTimeout(()=>document.getElementById('wf-name').focus(), 100);
}

function openEditWF(id) {
  const wf = workflows.find(w=>w.id===id);
  if (!wf) return;
  document.getElementById('wf-edit-id').value = id;
  document.getElementById('wf-name').value = wf.name||'';
  document.getElementById('wf-desc').value = wf.desc||'';
  pickStatus(wf.status||'dev');
  document.getElementById('dlg-wf-title').textContent = 'Editar workflow';
  document.getElementById('dlg-wf').classList.add('open');
  setTimeout(()=>document.getElementById('wf-name').focus(), 100);
}

function closeDlgWF() { document.getElementById('dlg-wf').classList.remove('open'); }

function pickStatus(s) {
  document.getElementById('wf-status').value = s;
  document.querySelectorAll('.status-opt').forEach(el => {
    el.classList.toggle('selected', el.dataset.s===s);
  });
}

async function saveWF() {
  const name = document.getElementById('wf-name').value.trim();
  if (!name) { alert('Informe o nome do workflow.'); return; }
  const editId = document.getElementById('wf-edit-id').value;
  const now = new Date().toISOString();

  if (editId) {
    const idx = workflows.findIndex(w=>w.id===editId);
    if (idx>=0) {
      workflows[idx] = {...workflows[idx],
        name, desc:document.getElementById('wf-desc').value,
        status:document.getElementById('wf-status').value,
        updatedAt:now
      };
    }
    toast('Workflow atualizado ✓');
  } else {
    const wf = {
      id: 'wf_' + Date.now(),
      name, desc:document.getElementById('wf-desc').value,
      status:document.getElementById('wf-status').value,
      createdAt:now, updatedAt:now
    };
    workflows.unshift(wf);
    toast('Workflow criado ✓');
  }

  closeDlgWF();
  saveLocal();
  renderGrid();
  await saveWorkflowsToSheets();
}

async function duplicateWF(id) {
  const wf = workflows.find(w=>w.id===id);
  if (!wf) return;
  const now = new Date().toISOString();
  const copy = {...wf, id:'wf_'+Date.now(), name:wf.name+' (cópia)', status:'dev', createdAt:now, updatedAt:now};
  workflows.unshift(copy);
  saveLocal();
  renderGrid();
  toast('Workflow duplicado ✓');
  await saveWorkflowsToSheets();
}

let pendingDeleteId = null;
function confirmDeleteWF(id) {
  const wf = workflows.find(w=>w.id===id);
  if (!wf) return;
  pendingDeleteId = id;
  document.getElementById('del-wf-name').textContent = wf.name;
  document.getElementById('dlg-del').classList.add('open');
  document.getElementById('del-confirm-btn').onclick = async () => {
    workflows = workflows.filter(w=>w.id!==pendingDeleteId);
    document.getElementById('dlg-del').classList.remove('open');
    saveLocal();
    renderGrid();
    toast('Workflow excluído');
    await saveWorkflowsToSheets();
  };
}

// ─── Open workflow ─────────────────────────────────────────────────────────────
function openWorkflow(wf) {
  // Update URL hash
  location.hash = wf.id;
  // Store active workflow
  localStorage.setItem('aw_active_wf', JSON.stringify(wf));
  // Redirect to workflow editor
  location.href = 'editor.html#' + wf.id;
}

// Close dialogs on overlay click
document.querySelectorAll('.dlg-overlay').forEach(dlg => {
  dlg.addEventListener('click', e => { if(e.target===dlg) dlg.classList.remove('open'); });
});

// Keyboard: ESC closes dialogs
document.addEventListener('keydown', e => {
  if (e.key==='Escape') document.querySelectorAll('.dlg-overlay.open').forEach(d=>d.classList.remove('open'));
  if (e.key==='Enter' && document.getElementById('dlg-wf').classList.contains('open')) saveWF();
});

init();
</script>
</body>
</html>
